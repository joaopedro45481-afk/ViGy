<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitangelo é 100% gay!</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      background: #0d0f1d;
      color: #ffffff;
      position: relative;
    }

    /* Dynamic Fluid Aurora Background */
    .fluid-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      filter: blur(80px);
      opacity: 0.85;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      animation: floatOrb 18s infinite alternate ease-in-out;
    }

    .blob-1 {
      top: -10%;
      left: -10%;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.8), rgba(236, 72, 153, 0.4));
      animation-duration: 22s;
    }

    .blob-2 {
      bottom: -15%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.8), rgba(99, 102, 241, 0.5));
      animation-duration: 18s;
      animation-delay: -5s;
    }

    .blob-3 {
      top: 30%;
      left: 20%;
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.7), rgba(139, 92, 246, 0.5));
      animation-duration: 25s;
      animation-delay: -10s;
    }

    .blob-4 {
      bottom: 20%;
      left: -15%;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(45, 212, 191, 0.6), rgba(56, 189, 248, 0.4));
      animation-duration: 20s;
      animation-delay: -15s;
    }

    @keyframes floatOrb {
      0% {
        transform: translate(0px, 0px) scale(1) rotate(0deg);
      }
      33% {
        transform: translate(80px, -60px) scale(1.15) rotate(120deg);
      }
      66% {
        transform: translate(-50px, 70px) scale(0.9) rotate(240deg);
      }
      100% {
        transform: translate(40px, 30px) scale(1.05) rotate(360deg);
      }
    }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        inset 0 -1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    /* Liquid Glass Glare effect */
    .liquid-glass::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 45%,
        rgba(255, 255, 255, 0.12) 50%,
        transparent 55%
      );
      transform: rotate(30deg);
      pointer-events: none;
      animation: sheen 10s infinite linear;
    }

    @keyframes sheen {
      0% { transform: translateX(-100%) rotate(30deg); }
      20% { transform: translateX(100%) rotate(30deg); }
      100% { transform: translateX(100%) rotate(30deg); }
    }

    .liquid-glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    /* Counter Animations */
    .counter-pop {
      animation: popEffect 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popEffect {
      0% { transform: scale(1); }
      50% { transform: scale(1.35) rotate(-3deg); filter: brightness(1.3); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Glass Button Hover & Active States */
    .glass-btn {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.6), rgba(99, 102, 241, 0.6));
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 
        0 12px 30px rgba(168, 85, 247, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.5);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-btn:hover {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.8), rgba(99, 102, 241, 0.8));
      transform: translateY(-3px) scale(1.02);
      box-shadow: 
        0 18px 40px rgba(168, 85, 247, 0.5),
        inset 0 1px 2px rgba(255, 255, 255, 0.7);
    }

    .glass-btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 5px 15px rgba(168, 85, 247, 0.3);
    }

    /* Floating Liquid Glass Popups */
    .popup-glass {
      position: fixed;
      padding: 14px 24px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 9999px;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.6);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
      animation: floatUpPopup 3s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes floatUpPopup {
      0% {
        opacity: 0;
        transform: scale(0.4) translateY(30px);
      }
      15% {
        opacity: 1;
        transform: scale(1.05) translateY(0);
      }
      25% {
        transform: scale(1) translateY(0);
      }
      80% {
        opacity: 1;
        transform: translateY(-40px);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(0.9);
      }
    }

    /* Custom Scrollbar for Comments */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-6 md:p-8">

  <!-- Dynamic Fluid Liquid Aurora Background -->
  <div class="fluid-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <!-- Main Application Container -->
  <main class="liquid-glass rounded-3xl p-6 sm:p-8 md:p-10 max-w-lg w-full text-center z-10 my-8">
    
    <!-- Title Badge -->
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full liquid-glass-card mb-6 border border-white/20">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-xs font-semibold tracking-wider uppercase text-purple-200">Verificação Oficial</span>
    </div>

    <!-- Main Title -->
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight mb-4 leading-tight">
      <span class="bg-clip-text text-transparent bg-gradient-to-r from-sky-300 via-purple-300 to-pink-300 drop-shadow-sm">
        Vitangelo é 100% gay!
      </span>
    </h1>
    
    <p class="text-sm sm:text-base text-purple-100/80 mb-8 font-medium">
      O veredito supremo do universo digital. Clique no botão abaixo para registrar seu voto oficial!
    </p>

    <!-- Counter Display Box -->
    <div class="liquid-glass-card rounded-2xl p-6 mb-8 border border-white/10 relative group">
      <div class="text-xs uppercase tracking-widest text-indigo-200 font-bold mb-1">
        Total de Confirmações
      </div>
      <div id="count" class="text-5xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white via-sky-200 to-purple-300 my-1 drop-shadow-md">
        0
      </div>
      <div class="text-xs text-slate-300/70 font-medium">
        pessoas já confirmaram esta verdade
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-3 mb-8">
      <!-- Primary Confirm Button -->
      <button id="btnConfirm" onclick="confirmar()" class="glass-btn w-full py-4 px-6 rounded-2xl text-lg font-bold text-white flex items-center justify-center gap-3 group cursor-pointer">
        <i class="fa-solid fa-circle-check text-xl group-hover:scale-110 transition-transform"></i>
        <span>CONFIRMAR AGORA</span>
      </button>

      <!-- WhatsApp Share Button -->
      <button onclick="compartilharWhatsApp()" class="w-full py-3 px-6 rounded-2xl text-sm font-semibold text-emerald-100 bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/30 transition-all flex items-center justify-center gap-2 cursor-pointer backdrop-blur-md">
        <i class="fa-brands fa-whatsapp text-lg text-emerald-400"></i>
        <span>Compartilhar no WhatsApp</span>
      </button>
    </div>

    <!-- Mural de Comentários estilo Vidro -->
    <div class="text-left">
      <div class="flex items-center justify-between mb-3 px-1">
        <h2 class="text-sm font-bold text-purple-200 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-comments text-pink-400"></i>
          Mural de Confirmações
        </h2>
        <span id="commentBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-white/10 text-purple-200 border border-white/10">0 recentes</span>
      </div>

      <div id="commentList" class="comment-list custom-scrollbar max-h-48 overflow-y-auto space-y-2 pr-1">
        <!-- Comentários gerados dinamicamente via JS -->
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="fixed bottom-3 text-center text-xs text-white/40 z-10 pointer-events-none">
    Design Liquid Glass &bull; Interativo & Responsive
  </footer>

  <script>
    // Database of 50 varied humorous confirmation comments
    const frasesConfirmacao = [
      "Eu já sabia! 😂",
      "100% verídico, sem dúvidas!",
      "Comprovado cientificamente! 🧪",
      "Sempre soube disso!",
      "Nada de novo sob o sol ☀️",
      "Confirmadíssimo com sucesso! ✅",
      "Não tinha nem como discordar!",
      "Isso é um fato histórico! 📜",
      "Mais confirmado que isso, impossível!",
      "Assinado e registrado no cartório! ✍️",
      "A NASA acabou de confirmar! 🚀",
      "Zero surpresas por aqui! 😎",
      "O mistério finalmente acabou! 🕵️‍♂️",
      "Assino embaixo sem pensar duas vezes!",
      "E alguém ainda tinha dúvida? 🤔",
      "A verdade prevaleceu!",
      "Notícia do ano! 🗞️",
      "Tá escrito nas estrelas! ✨",
      "Confirmado pelo tribunal da internet! ⚖️",
      "Era o segredo mais mal guardado do mundo!",
      "Sem contestação possível!",
      "10 entre 10 especialistas confirmam! 🩺",
      "Essa informação vale ouro! 🥇",
      "Podem fechar as urnas, tá confirmado!",
      "A comunidade científica apoia esse fato! 🔬",
      "Já era evidente há tempos!",
      "Confirmado até pelo ChatGPT! 🤖",
      "Isso devia estar nos livros de história!",
      "Claro como a luz do dia! 💡",
      "Absolutamente incontestável!",
      "Chegou a notificação de confirmação! 🔔",
      "Não restam dúvidas no recinto!",
      "Carimbado e aprovado! 🏷️",
      "A pura verdade stamped na tela!",
      "O universo conspirou para essa confirmação!",
      "Voto SIM com orgulho! 👍",
      "Histórico e inegável!",
      "Já tava na hora de oficializar!",
      "Todos os indícios apontavam pra isso!",
      "Registrado para a posteridade! 📸",
      "Ninguém fica surpreso com essa! 🤷‍♂️",
      "Concordo plenamente e sem ressalvas!",
      "A confirmação mais rápida da história!",
      "Tá no radar de todo mundo!",
      "Provas irrefutáveis foram apresentadas! 📂",
      "Esse fato uniu toda a galera!",
      "Consenso geral na roda de amigos!",
      "Nem o FBI discorda desse resultado! 🔍",
      "A manchete principal do dia! 📢",
      "Confirmação número 1 no ranking! 🏆"
    ];

    // Local Storage State Management
    let totalCount = localStorage.getItem('vitangelo_confirmations_count') ? 
                     parseInt(localStorage.getItem('vitangelo_confirmations_count')) : 0;
    
    let commentHistory = localStorage.getItem('vitangelo_comments_history') ? 
                         JSON.parse(localStorage.getItem('vitangelo_comments_history')) : [];

    const countEl = document.getElementById('count');
    const commentListEl = document.getElementById('commentList');
    const commentBadgeEl = document.getElementById('commentBadge');

    // On Load Initialization
    window.onload = function() {
      countEl.innerText = totalCount.toLocaleString('pt-BR');
      renderComments();
    };

    // Web Audio API Synthesizer (No external audio file dependencies)
    function playAudioTone(freq = 600, type = 'sine', duration = 0.12, gainValue = 0.25) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        
        // Envelope
        gain.gain.setValueAtTime(gainValue, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        // Audio might be blocked until user gesture, safely ignore
      }
    }

    // Special Fanfare Chime for Milestones
    function playMilestoneSound() {
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, index) => {
        setTimeout(() => {
          playAudioTone(freq, 'triangle', 0.25, 0.3);
        }, index * 90);
      });
    }

    // Main Confirm Action
    function confirmar() {
      totalCount++;
      localStorage.setItem('vitangelo_confirmations_count', totalCount);
      
      // Update Counter Display with Pop Animation
      countEl.innerText = totalCount.toLocaleString('pt-BR');
      countEl.classList.remove('counter-pop');
      void countEl.offsetWidth; // Force reflow
      countEl.classList.add('counter-pop');

      // Randomly select a comment from the array of 50
      const frase = frasesConfirmacao[Math.floor(Math.random() * frasesConfirmacao.length)];

      // Spawn floating glass popup
      spawnLiquidGlassPopup(frase);

      // Record to mural
      addCommentToMural(frase);

      // Handle Confetti Fireworks & Sound Effects
      if (totalCount % 10 === 0) {
        playMilestoneSound();
        triggerSuperFireworks();
      } else {
        playAudioTone(480 + Math.random() * 250, 'sine', 0.12);
        triggerNormalConfetti();
      }
    }

    // Floating Glass Popup Generator
    function spawnLiquidGlassPopup(text) {
      const popup = document.createElement('div');
      popup.className = 'popup-glass flex items-center gap-2';
      popup.innerHTML = `<i class="fa-solid fa-sparkles text-amber-300"></i> <span>${text}</span>`;

      // Safe Random positioning around screen center
      const posX = Math.random() * 55 + 20; // 20% to 75%
      const posY = Math.random() * 45 + 25; // 25% to 70%

      popup.style.left = `${posX}%`;
      popup.style.top = `${posY}%`;

      document.body.appendChild(popup);

      setTimeout(() => {
        popup.remove();
      }, 3000);
    }

    // Add new comment to mural
    function addCommentToMural(text) {
      const timeStamp = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const newEntry = { text: text, time: timeStamp };
      
      commentHistory.unshift(newEntry);
      if (commentHistory.length > 25) commentHistory.pop(); // Keep last 25

      localStorage.setItem('vitangelo_comments_history', JSON.stringify(commentHistory));
      renderComments();
    }

    // Render Comments in Liquid Glass list
    function renderComments() {
      commentBadgeEl.innerText = `${commentHistory.length} recentes`;

      if (commentHistory.length === 0) {
        commentListEl.innerHTML = `
          <div class="text-center py-6 text-white/40 text-xs italic">
            Nenhuma confirmação registrada ainda. Seja o primeiro!
          </div>
        `;
        return;
      }

      commentListEl.innerHTML = commentHistory.map((item, idx) => `
        <div class="liquid-glass-card rounded-xl p-3 text-xs flex items-center justify-between gap-3 border border-white/10 transform transition-all hover:translate-x-1">
          <div class="flex items-center gap-2.5 truncate">
            <div class="w-2 h-2 rounded-full bg-purple-400 shrink-0"></div>
            <span class="text-purple-100 font-medium truncate">${item.text}</span>
          </div>
          <span class="text-[10px] text-white/40 font-mono shrink-0">${item.time}</span>
        </div>
      `).join('');
    }

    // Confetti Effects
    function triggerNormalConfetti() {
      confetti({
        particleCount: 50,
        spread: 60,
        origin: { y: 0.75 },
        colors: ['#a855f7', '#38bdf8', '#f472b6', '#ffffff']
      });
    }

    function triggerSuperFireworks() {
      const duration = 2.5 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
          return clearInterval(interval);
        }

        const particleCount = 50 * (timeLeft / duration);
        
        confetti(Object.assign({}, defaults, { 
          particleCount, 
          origin: { x: randomInRange(0.1, 0.4), y: Math.random() - 0.2 },
          colors: ['#a855f7', '#ec4899', '#38bdf8', '#fbbf24']
        }));
        confetti(Object.assign({}, defaults, { 
          particleCount, 
          origin: { x: randomInRange(0.6, 0.9), y: Math.random() - 0.2 },
          colors: ['#a855f7', '#ec4899', '#38bdf8', '#fbbf24']
        }));
      }, 250);
    }

    // WhatsApp Share Functionality
    function compartilharWhatsApp() {
      const texto = encodeURIComponent(`Já são ${totalCount.toLocaleString('pt-BR')} confirmações oficiais de que o Vitangelo é 100% Gay! 🚀\n\nVenha confirmar você também:`);
      window.open(`https://api.whatsapp.com/send?text=${texto}`, '_blank');
    }
  </script>
</body>
</html>
